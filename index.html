                        badge.textContent = orders.sort((a, b) => a - b).join(',');
                        el.appendChild(badge);
                    }
                }
                $('analysisStatus').textContent = `標註已更新為：「${newText.trim()}」`;
            }
            autoSave();
        }

        function updateXray() {
            const basements = parseInt($('basements').value) || 0;
            ground.material.transparent = xrayMode || basements > 0 || onlyBasement;
            ground.material.opacity = (xrayMode || basements > 0 || onlyBasement) ? 0.35 : 1;
            ground.material.needsUpdate = true;

            [mainBuilding, additionsGroup].forEach(group => {
                group.traverse(o => {
                    if (!o.isMesh) return;
                    const isFloor = o.material.name === 'floor' || o.userData.floor;
                    const isBasement = o.userData.isBasement || false;
                    
                    if (onlyBasement) {
                        if (!isBasement) {
                            o.material.transparent = true;
                            o.material.opacity = 0.0;
                            o.material.depthWrite = false;
                            o.material.needsUpdate = true;
                        } else {
                            o.material.transparent = false;
                            o.material.opacity = 1;
                            o.material.depthWrite = true;
                            o.material.needsUpdate = true;
                        }
                        return;
                    }
                    
                    if (isBasement) {
                        o.material.transparent = true;
                        o.material.opacity = 0.5;
                        o.material.depthWrite = false;
                        o.material.needsUpdate = true;
                        return;
                    }
                    if (isFloor) {
                        o.material.opacity = 1;
                        o.material.transparent = false;
                        o.material.depthWrite = true;
                        o.material.needsUpdate = true;
                        return;
                    }
                    o.material.transparent = xrayMode;
                    o.material.opacity = xrayMode ? 0.22 : 1;
                    o.material.depthWrite = !xrayMode;
                    o.material.needsUpdate = true;
                });
            });
            $('perspectiveBtn').textContent = `透視樓板：${xrayMode?'開':'關'}`;
        }

        function setLighting(style) {
            const themes = {
                day: { bg: '#dfe7f1', fog: '#dfe7f1', ground: '#c7d0d5', hemi: 2.1, sun: 3, sunColor: '#fff4df',
                    exposure: 1 },
                neutral: { bg: '#d6dbe1', fog: '#d6dbe1', ground: '#b9c0c7', hemi: 1.5, sun: 2.1, sunColor: '#ffffff',
                    exposure: .9 },
                evening: { bg: '#574f62', fog: '#574f62', ground: '#766a69', hemi: .8, sun: 1.9, sunColor: '#ffb66e',
                    exposure: .82 },
                night: { bg: '#151c2d', fog: '#151c2d', ground: '#293344', hemi: .35, sun: .65, sunColor: '#8ca8ff',
                    exposure: .72 }
            } [style];
            scene.background = new THREE.Color(themes.bg);
            scene.fog.color.set(themes.fg);
            ground.material.color.set(themes.ground);
            hemi.intensity = themes.hemi;
            sun.intensity = themes.sun;
            sun.color.set(themes.sunColor);
            renderer.toneMappingExposure = themes.exposure;
        }

        function selectBuildings(groups) {
            selectionBoxes.forEach(box => scene.remove(box));
            selectionBoxes = [];
            selectedBuildings = groups.filter(g => g !== null);
            updateAnnotationFloorOptions();

            const scaleInput = $('scaleInput');
            if (selectedBuildings.length === 0) {
                $('deleteBuildingBtn').disabled = true;
                scaleInput.disabled = true;
                scaleInput.value = 1;
                $('analysisStatus').textContent = '未選取建築';
                return;
            }

            selectedBuildings.forEach(g => {
                const box = new THREE.BoxHelper(g, '#ff8b36');
                scene.add(box);
                selectionBoxes.push(box);
            });

            $('deleteBuildingBtn').disabled = false;
            scaleInput.disabled = false;
            scaleInput.value = selectedBuildings[0].scale.x.toFixed(2);

            const center = new THREE.Vector3();
            if (selectedBuildings.length > 1) {
                const avg = new THREE.Vector3();
                selectedBuildings.forEach(g => {
                    const c = new THREE.Vector3();
                    new THREE.Box3().setFromObject(g).getCenter(c);
                    avg.add(c);
                });
                avg.divideScalar(selectedBuildings.length);
                controls.target.copy(avg);
            } else {
                new THREE.Box3().setFromObject(selectedBuildings[0]).getCenter(center);
                controls.target.copy(center);
            }
            controls.update();

            $('analysisStatus').textContent = `已選取 ${selectedBuildings.length} 棟建築 (視角中心已對準)`;
        }

        function toggleBuildingSelection(building) {
            if (!building) return;
            const idx = selectedBuildings.indexOf(building);
            if (idx >= 0) {
                const newList = selectedBuildings.filter(b => b !== building);
                selectBuildings(newList);
            } else {
                const newList = [...selectedBuildings, building];
                selectBuildings(newList);
            }
        }

        function deleteSelectedBuildings() {
            if (selectedBuildings.length === 0) return;
            const count = selectedBuildings.length;
            if (!confirm(`確定要刪除 ${count} 棟選取的建築嗎？\n(相關標註與連線也會一併移除)`)) return;

            const toRemove = [...selectedBuildings];
            toRemove.forEach(building => {
                if (building === mainBuilding) {
                    while (mainBuilding.children.length > 0) mainBuilding.remove(mainBuilding.children[0]);
                    mainBuilding.userData.floors = 0;
                    mainBuilding.userData.basements = 0;
                    deleteBuildingAnnotations(building);
                } else {
                    const idx = additionsGroup.children.indexOf(building);
                    if (idx >= 0) {
                        const prompt = building.userData?.prompt || '';
                        const i = additionPrompts.indexOf(prompt);
                        if (i >= 0) additionPrompts.splice(i, 1);
                        deleteBuildingAnnotations(building);
                        additionsGroup.remove(building);
                    }
                }
            });

            selectBuildings([]);
            $('analysisStatus').textContent = `已刪除 ${count} 棟建築。`;
            autoSave();
        }

        function deleteBuildingAnnotations(building) {
            const ids = [];
            annotations.forEach((data, idx) => {
                if (data.buildingId === building.userData.buildingId) {
                    ids.push(idx);
                }
            });
            ids.sort((a, b) => b - a).forEach(idx => {
                if (annotationObjects[idx] && annotationObjects[idx].parent) {
                    annotationObjects[idx].parent.remove(annotationObjects[idx]);
                }
                annotationObjects.splice(idx, 1);
                annotations.splice(idx, 1);
                relations = relations.map(r => ({
                    id: r.id,
                    from: r.from > idx ? r.from - 1 : r.from,
                    to: r.to > idx ? r.to - 1 : r.to,
                    order: r.order
                })).filter(r => r.from >= 0 && r.to >= 0);
                if (selectedAnnotationIndex === idx) selectedAnnotationIndex = -1;
                else if (selectedAnnotationIndex > idx) selectedAnnotationIndex--;
            });
            selectedRelationIds = selectedRelationIds.filter(id => relations.some(r => r.id === id));
            rebuildAnnotations();
            $('deleteSelectedAnnotationBtn').disabled = true;
            $('editAnnotationBtn').disabled = true;
            $('deleteAllRelationsBtn').disabled = relations.length === 0;
            $('deleteSelectedRelationsBtn').disabled = selectedRelationIds.length === 0;
        }

        function adjustSelectedBuilding(floorDelta = 0, basementDelta = 0) {
            if (selectedBuildings.length === 0) {
                alert('請先選取要調整的建築。');
                return;
            }
            
            const target = selectedBuildings[0];
            
            if (target === mainBuilding) {
                const currentFloors = parseInt($('floors').value) || 0;
                const currentBasements = parseInt($('basements').value) || 0;
                const newFloors = Math.max(0, currentFloors + floorDelta);
                const newBasements = Math.max(0, currentBasements + basementDelta);
                $('floors').value = newFloors;
                $('basements').value = newBasements;
                
                const width = parseFloat($('width').value) || 14;
                const wallColor = $('wallColor').value;
                const glassColor = $('glassColor').value;
                const shape = target.userData.shape || 'box';
                
                const pos = mainBuilding.position.clone();
                const sc = mainBuilding.scale.clone();
                
                while (mainBuilding.children.length > 0) {
                    mainBuilding.remove(mainBuilding.children[0]);
                }
                
                if (newFloors === 0 && newBasements === 0) {
                    mainBuilding.userData.floors = 0;
                    mainBuilding.userData.basements = 0;
                    mainBuilding.position.copy(pos);
                    mainBuilding.scale.copy(sc);
                    rebuildAnnotations();
                    updateXray();
                    selectBuildings([]);
                    $('analysisStatus').textContent = '主建築已完全移除 (無樓層)';
                    autoSave();
                    return;
                }
                
                const newBuilding = createBuilding(newFloors, newBasements, width, wallColor, glassColor, true, shape);
                while (newBuilding.children.length > 0) {
                    const child = newBuilding.children[0];
                    newBuilding.remove(child);
                    mainBuilding.add(child);
                }
                mainBuilding.userData.floors = newFloors;
                mainBuilding.userData.basements = newBasements;
                mainBuilding.userData.width = width;
                mainBuilding.userData.shape = shape;
                mainBuilding.position.copy(pos);
                mainBuilding.scale.copy(sc);
                
                rebuildAnnotations();
                updateXray();
                if (newFloors > 0 || newBasements > 0) {
                    selectBuildings([mainBuilding]);
                } else {
                    selectBuildings([]);
                }
                $('analysisStatus').textContent = `主建築已調整：${newFloors} 層，地下 ${newBasements} 層 (${shape})`;
                autoSave();
                return;
            }
            
            const old = target;
            const oldData = old.userData;
            if (!oldData || !oldData.isAddition) {
                alert('請選取新增的建物進行調整。');
                return;
            }
            
            const newFloors = Math.max(0, (oldData.floors || 3) + floorDelta);
            const newBasements = Math.max(0, (oldData.basements || 0) + basementDelta);
            
            if (newFloors === 0 && newBasements === 0) {
                const idx = additionsGroup.children.indexOf(old);
                if (idx >= 0) {
                    const pIdx = additionPrompts.indexOf(oldData.prompt);
                    if (pIdx >= 0) additionPrompts.splice(pIdx, 1);
                    deleteBuildingAnnotations(old);
                    additionsGroup.remove(old);
                    selectBuildings([]);
                    $('analysisStatus').textContent = '建築已完全移除 (無樓層)';
                }
                autoSave();
                return;
            }
            
            const pos = old.position.clone();
            const sc = old.scale.clone();
            const shape = oldData.shape || 'box';
            const width = oldData.width || 14;
            const depth = oldData.depth || null;
            const prompt = `${newFloors} 樓 (${shape})`;
            
            deleteBuildingAnnotations(old);
            
            const idx = additionsGroup.children.indexOf(old);
            if (idx >= 0) {
                const pIdx = additionPrompts.indexOf(oldData.prompt);
                if (pIdx >= 0) additionPrompts.splice(pIdx, 1);
                additionsGroup.remove(old);
            }
            
            const wallColor = $('wallColor').value;
            const glassColor = $('glassColor').value;
            
            const group = createBuilding(newFloors, newBasements, width, wallColor, glassColor, false, shape, depth);
            const id = nextBuildingId++;
            group.userData.buildingId = id;
            group.userData.isAddition = true;
            group.userData.floors = newFloors;
            group.userData.basements = newBasements;
            group.userData.width = width;
            group.userData.depth = depth;
            group.userData.shape = shape;
            group.userData.prompt = prompt;
            group.position.copy(pos);
            group.scale.copy(sc);
            group.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true } });
            additionsGroup.add(group);
            additionPrompts.push(prompt);
            
            rebuildAnnotations();
            updateXray();
            selectBuildings([group]);
            $('analysisStatus').textContent = `建築已調整：${newFloors} 層，地下 ${newBasements} 層 (${shape})`;
            autoSave();
        }

        function applySelectedAppearance() {
            if (selectedBuildings.length === 0) { alert('請先選取建築。'); return; }
            selectedBuildings.forEach(building => {
                if (building === mainBuilding) {
                    const floors = Math.max(0, parseInt($('floors').value) || 0);
                    const basements = Math.max(0, parseInt($('basements').value) || 0);
                    const width = Math.max(5, parseFloat($('width').value) || 14);
                    const wallColor = $('wallColor').value;
                    const glassColor = $('glassColor').value;
                    const shape = building.userData.shape || 'box';
                    
                    const pos = mainBuilding.position.clone();
                    const sc = mainBuilding.scale.clone();
                    
                    while (mainBuilding.children.length > 0) mainBuilding.remove(mainBuilding.children[0]);
                    
                    if (floors === 0 && basements === 0) {
                        mainBuilding.userData.floors = 0;
                        mainBuilding.userData.basements = 0;
                        mainBuilding.position.copy(pos);
                        mainBuilding.scale.copy(sc);
                        return;
                    }
                    
                    const newBuilding = createBuilding(floors, basements, width, wallColor, glassColor, true, shape);
                    while (newBuilding.children.length > 0) {
                        const child = newBuilding.children[0];
                        newBuilding.remove(child);
                        mainBuilding.add(child);
                    }
                    mainBuilding.userData.floors = floors;
                    mainBuilding.userData.basements = basements;
                    mainBuilding.userData.width = width;
                    mainBuilding.userData.shape = shape;
                    mainBuilding.position.copy(pos);
                    mainBuilding.scale.copy(sc);
                } else {
                    building.traverse(o => {
                        if (o.isMesh && !o.userData.floor && o.material.name !== 'floor' && !o.userData.isBasement)
                            o.material.color.set($('wallColor').value);
                    });
                }
            });
            updateXray();
            selectBuildings(selectedBuildings);
            $('analysisStatus').textContent = `已套用外觀色彩至 ${selectedBuildings.length} 棟建築。`;
            autoSave();
        }

        function groundPoint(e) {
            const r = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
            pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            return raycaster.intersectObject(ground)[0]?.point;
        }

        function drawFootprint(point) {
            if (!footprintStart) { footprintStart = point;
                $('mode').textContent = '請點擊第二個對角點'; return; }
            const minX = Math.min(footprintStart.x, point.x),
                maxX = Math.max(footprintStart.x, point.x),
                minZ = Math.min(footprintStart.z, point.z),
                maxZ = Math.max(footprintStart.z, point.z),
                w = Math.max(3, maxX - minX),
                d = Math.max(3, maxZ - minZ),
                x = (minX + maxX) / 2,
                z = (minZ + maxZ) / 2;
            if (footprintPreview) scene.remove(footprintPreview);
            const floors = Math.max(1, Math.min(30, parseInt($('newBuildingFloors').value) || 3));
            const shape = $('buildingShape').value || 'box';
            const p = `${floors} 樓建物 (${shape})`;
            const wallColor = $('wallColor').value;
            const glassColor = $('glassColor').value;
            const group = createBuilding(floors, 0, w, wallColor, glassColor, false, shape, d);
            const id = nextBuildingId++;
            group.userData.buildingId = id;
            group.userData.isAddition = true;
            group.userData.prompt = p;
            group.userData.floors = floors;
            group.userData.basements = 0;
            group.userData.width = w;
            group.userData.depth = d;
            group.userData.shape = shape;
            group.position.set(x, 0, z);
            group.scale.set(1, 1, 1);
            group.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true } });
            additionsGroup.add(group);
            additionPrompts.push(p);
            updateXray();
            $('analysisStatus').textContent = `框選新增建築：${floors} 層 (${shape}) 尺寸 ${w.toFixed(1)} x ${d.toFixed(1)}`;
            selectBuildings([group]);
            footprintStart = null;
            clearModes();
            autoSave();
        }

        function clearModes() {
            annotationMode = selectionMode = footprintMode = relationMode = multiLinkMode = moveMode =
                lineSelectMode = deleteMode = false;
            footprintStart = null;
            if (footprintPreview) { scene.remove(footprintPreview);
                footprintPreview = null; }
            ['annotationBtn', 'selectBtn', 'footprintBtn', 'relationBtn', 'multiLinkBtn', 'moveBtn', 'lineSelectBtn',
                'topMoveBtn', 'topAnnotationBtn', 'topDeleteBtn'
            ].forEach(
                id => $(id).classList.remove('active', 'primary', 'active-tool'));
            $('mode').classList.remove('show');
            renderer.domElement.style.cursor = 'grab';
            if (!multiLinkMode) {
                selectedForLink.forEach(i => { if (annotationObjects[i]) annotationObjects[i].element.classList.remove(
                        'selected'); });
                selectedForLink = [];
                updateMultiLinkUI();
            }
            clearRelationSelection();
            relationStart = null;
            if (isDragging) {
                isDragging = false;
                dragTarget = null;
            }
        }

        function addAnnotation(point, text, icon = $('annotationIcon').value, color = $('annotationColor').value,
            parentGroup = mainBuilding, floorValue = null) {
            const el = document.createElement('div');
            el.className = 'annotation';
            el.textContent = text;
            el.style.pointerEvents = 'auto';
            el.style.setProperty('--symbol', `"${icon}"`);
            el.style.setProperty('--accent', color);
            const obj = new CSS2DObject(el);

            const localPos = parentGroup.worldToLocal(point.clone());
            obj.position.copy(localPos);
            parentGroup.add(obj);

            const buildingId = parentGroup.userData.buildingId !== undefined ? parentGroup.userData.buildingId : 0;
            const record = {
                position: point.toArray(),
                text,
                icon,
                color,
                buildingId: buildingId,
                floor: (floorValue && floorValue !== 'surface') ? floorValue : null
            };
            const index = annotations.length;
            annotations.push(record);
            annotationObjects.push(obj);
            el.dataset.index = index;

            attachAnnotationInteraction(el, index);

            updateAnnotationBadges();
            $('analysisStatus').textContent = `已新增標示：「${text}」 (${icon})`;
            autoSave();
            return record;
        }

        function getBuildingGroupFromHit(hit) {
            if (!hit) return mainBuilding;
            if (hit.object === ground) return groundGroup;
            let obj = hit.object;
            while (obj.parent && obj.parent !== mainBuilding && obj.parent !== additionsGroup) {
                obj = obj.parent;
            }
            if (obj === mainBuilding || obj.parent === mainBuilding) return mainBuilding;
            if (obj.parent === additionsGroup) return obj;
            return mainBuilding;
        }

        function getBuildingFromMesh(meshObj) {
            let g = meshObj;
            while (g.parent && g.parent !== mainBuilding && g.parent !== additionsGroup) {
                g = g.parent;
            }
            if (g.parent === mainBuilding) return mainBuilding;
            if (g.parent === additionsGroup) return g;
            return null;
        }

        function getBuildingFromRaycast(event) {
            const r = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - r.left) / r.width) * 2 - 1;
            pointer.y = -((event.clientY - r.top) / r.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const targets = [];
            mainBuilding.traverse(o => { if (o.isMesh) targets.push(o); });
            additionsGroup.traverse(o => { if (o.isMesh) targets.push(o); });

            const hit = raycaster.intersectObjects(targets, false)[0];
            if (hit && hit.object.isMesh) {
                return getBuildingFromMesh(hit.object);
            }
            return null;
        }

        function getGroundIntersect(event) {
            const r = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - r.left) / r.width) * 2 - 1;
            pointer.y = -((event.clientY - r.top) / r.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObject(ground);
            if (hits.length > 0) return hits[0].point;
            return null;
        }

        // === 樓層平面標註 (可在任一樓層平面任意點新增標註，不受限於外牆表面) ===
        function getAnnotationTargetBuilding() {
            if (selectedBuildings.length > 0) return selectedBuildings[0];
            if (mainBuilding.userData.floors > 0) return mainBuilding;
            return null;
        }

        function updateAnnotationFloorOptions() {
            const select = $('annotationFloorSelect');
            if (!select) return;
            const prevValue = select.value;
            const building = getAnnotationTargetBuilding();
            select.innerHTML = '';
            const surfaceOpt = document.createElement('option');
            surfaceOpt.value = 'surface';
            surfaceOpt.textContent = '依畫面點擊 (建物表面)';
            select.appendChild(surfaceOpt);

            const floors = building ? (building.userData.floors || 0) : 0;
            for (let k = 1; k <= floors; k++) {
                const opt = document.createElement('option');
                opt.value = String(k);
                opt.textContent = k === 1 ? '1樓 (地面樓板任意點)' : `${k}樓 (樓板任意點)`;
                select.appendChild(opt);
            }
            const basements = building ? (building.userData.basements || 0) : 0;
            for (let b = 1; b <= basements; b++) {
                const opt = document.createElement('option');
                opt.value = `b${b}`;
                opt.textContent = `地下${b}樓 (樓板任意點)`;
                select.appendChild(opt);
            }

            const values = Array.from(select.options).map(o => o.value);
            select.value = values.includes(prevValue) ? prevValue : 'surface';
        }

        // 取得指定樓層在建物本地座標中的 Y 高度 (與 createBuilding 的樓板生成邏輯對應)
        function getFloorLocalY(floorValue, building) {
            if (floorValue === 'surface') return null;
            if (typeof floorValue === 'string' && floorValue.startsWith('b')) {
                const b = parseInt(floorValue.slice(1), 10);
                const basements = (building && building.userData.basements) || 0;
                // 最底層地下室：使用最底部樓板；其餘地下室：使用下一層天花板樓板
                if (b >= basements) return -basements * STORY_HEIGHT + 0.18;
                return -b * STORY_HEIGHT - 0.18;
            }
            const k = parseInt(floorValue, 10);
            if (k <= 1) return 0;
            return (k - 1) * STORY_HEIGHT - 0.18;
        }

        // 將世界座標點限制在建物該樓層平面範圍內 (方形以寬深為界，圓柱以半徑為界)，並校正到該樓層高度
        function clampPointToFloorBounds(building, worldPoint, localY) {
            const localPoint = building.worldToLocal(worldPoint.clone());
            const w = building.userData.width || 14;
            const shape = building.userData.shape || 'box';
            const d = building.userData.depth || (shape === 'cylinder' ? w : w * 0.67);

            if (shape === 'cylinder') {
                const maxR = Math.max(0.5, w / 2 - 0.3);
                const dist = Math.hypot(localPoint.x, localPoint.z);
                if (dist > maxR && dist > 0) {
                    const s = maxR / dist;
                    localPoint.x *= s;
                    localPoint.z *= s;
                }
            } else {
                const maxX = Math.max(0.5, w / 2 - 0.3);
                const maxZ = Math.max(0.5, d / 2 - 0.3);
                localPoint.x = Math.max(-maxX, Math.min(maxX, localPoint.x));
                localPoint.z = Math.max(-maxZ, Math.min(maxZ, localPoint.z));
            }
            localPoint.y = localY;
            return building.localToWorld(localPoint.clone());
        }

        // 以水平數學平面計算點擊位置 (可略過遮擋的牆面/樓板，命中該樓層平面上任一點)，
        // 並將結果限制在建物的平面範圍內。用於「單次點擊新增標註」，一次點擊即為目標位置，較無角度問題。
        function computeFloorClickPoint(event, building, localY) {
            const r = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - r.left) / r.width) * 2 - 1;
            pointer.y = -((event.clientY - r.top) / r.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const worldOrigin = building.localToWorld(new THREE.Vector3(0, localY, 0));
            const worldUp = building.localToWorld(new THREE.Vector3(0, localY + 1, 0));
            const normal = worldUp.sub(worldOrigin).normalize();
            const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, worldOrigin);
            const worldPoint = new THREE.Vector3();
            if (!raycaster.ray.intersectPlane(plane, worldPoint)) return null;

            return clampPointToFloorBounds(building, worldPoint, localY);
        }

        function startDrag(event, building) {
            if (!building) return;
            dragTarget = building;
            const pt = getGroundIntersect(event);
            if (!pt) { dragTarget = null; return; }
            dragStartPos.copy(building.position);
            dragOffset.copy(pt).sub(building.position);
            isDragging = true;
            renderer.domElement.style.cursor = 'grabbing';
            $('analysisStatus').textContent = `拖曳中… (${building === mainBuilding ? '主建築' : '新增建築'})`;
            controls.enabled = false;
        }

        function updateDrag(event) {
            if (!isDragging || !dragTarget) return;
            const pt = getGroundIntersect(event);
            if (!pt) return;
            const newPos = pt.clone().sub(dragOffset);
            newPos.y = 0;
            const delta = newPos.clone().sub(dragStartPos);
            dragTarget.position.copy(newPos);

            annotations.forEach((data, idx) => {
                const obj = annotationObjects[idx];
                if (obj && obj.parent === dragTarget) {
                    const worldPos = obj.position.clone();
                    obj.parent.localToWorld(worldPos);
                    data.position[0] = worldPos.x;
                    data.position[1] = worldPos.y;
                    data.position[2] = worldPos.z;
                }
            });
            rebuildRelations();

            selectionBoxes.forEach(box => scene.remove(box));
            selectionBoxes = [];
            selectedBuildings.forEach(g => {
                const box = new THREE.BoxHelper(g, '#ff8b36');
                scene.add(box);
                selectionBoxes.push(box);
            });
        }

        function endDrag() {
            if (isDragging && dragTarget) {
                $('analysisStatus').textContent = `已移動${dragTarget === mainBuilding ? '主建築' : '新增建築'} 至 (${dragTarget.position.x.toFixed(1)}, ${dragTarget.position.z.toFixed(1)})`;
                rebuildRelations();
                autoSave();
            }
            isDragging = false;
            dragTarget = null;
            controls.enabled = true;
            renderer.domElement.style.cursor = moveMode ? 'grab' : 'grab';
        }

        function updateScale(val) {
            if (selectedBuildings.length === 0) return;
            const s = parseFloat(val);
            if (isNaN(s) || s < 0.1) return;
            selectedBuildings.forEach(building => {
                building.scale.set(s, s, s);
            });
            selectionBoxes.forEach(box => scene.remove(box));
            selectionBoxes = [];
            selectedBuildings.forEach(g => {
                const box = new THREE.BoxHelper(g, '#ff8b36');
                scene.add(box);
                selectionBoxes.push(box);
            });
            annotations.forEach((data, idx) => {

        function loadProjectData(data) {

            Object.entries(data.settings || {}).forEach(([id, v]) => { if ($(id)) $(id).value = v; });
            if (data.lineColor) $('lineColor').value = data.lineColor;
            if (data.lineWidth) $('lineWidth').value = data.lineWidth;
            setLighting($('lightingPreset').value);
            xrayMode = !!data.xrayMode;
            onlyBasement = !!data.onlyBasement;

            while (mainBuilding.children.length > 0) mainBuilding.remove(mainBuilding.children[0]);
            if (data.mainBuildingData && data.mainBuildingData.floors > 0) {
                const md = data.mainBuildingData;
                const group = createBuilding(md.floors, md.basements, md.width,
                    data.settings?.wallColor || '#e5e1d8',
                    data.settings?.glassColor || '#557c9c', true, md.shape || 'box');
                group.userData.buildingId = 0;
                group.userData.isMain = true;
                group.userData.floors = md.floors;
                group.userData.basements = md.basements;
                group.userData.width = md.width;
                group.userData.shape = md.shape || 'box';
                while (group.children.length > 0) {
                    const child = group.children[0];
                    group.remove(child);
                    mainBuilding.add(child);
                }
                if (data.mainBuildingPosition) mainBuilding.position.set(...data.mainBuildingPosition);
                if (data.mainBuildingScale) mainBuilding.scale.set(...data.mainBuildingScale);
            }

            (data.additionsData || []).forEach(ad => {
                const prompt = ad.prompt || `${ad.floors||3} 樓建物`;
                const shape = ad.shape || 'box';
                const wallColor = data.settings?.wallColor || '#e5e1d8';
                const glassColor = data.settings?.glassColor || '#557c9c';
                const group = createBuilding(ad.floors || 3, ad.basements || 0, ad.width || 11,
                    wallColor, glassColor, false, shape, ad.depth || null);
                const id = ad.id || nextBuildingId++;
                group.userData.buildingId = id;
                group.userData.isAddition = true;
                group.userData.floors = ad.floors || 3;
                group.userData.basements = ad.basements || 0;
                group.userData.width = ad.width || 11;
                group.userData.depth = ad.depth || null;
                group.userData.shape = shape;
                group.userData.prompt = prompt;
                group.position.set(ad.position[0], 0, ad.position[2]);
                if (ad.scale) group.scale.set(...ad.scale);
                group.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true } });
                additionsGroup.add(group);
                additionPrompts.push(prompt);
            });

            (data.annotations || []).forEach(a => {
                const parent = findBuildingById(a.buildingId) || mainBuilding;
                const el = document.createElement('div');
                el.className = 'annotation';
                el.textContent = a.text;
                el.style.pointerEvents = 'auto';
                el.style.setProperty('--symbol', `"${a.icon || '●'}"`);
                el.style.setProperty('--accent', a.color || '#5f8aff');
                const obj = new CSS2DObject(el);
                const localPos = parent.worldToLocal(new THREE.Vector3(...a.position));
                obj.position.copy(localPos);
                parent.add(obj);
                const index = annotations.length;
                annotations.push({ ...a });
                annotationObjects.push(obj);
                el.dataset.index = index;
                attachAnnotationInteraction(el, index);
            });

            (data.relations || []).forEach(r => {
                if (annotations[r.from] && annotations[r.to]) {
                    const color = new THREE.Color($('lineColor').value || '#ff8b36');
                    const width = parseFloat($('lineWidth').value || '3');
                    const relationRecord = { id: r.id || nextRelationId++, from: r.from, to: r.to, order: r.order || 1 };
                    const obj = drawRelation(annotations[r.from], annotations[r.to], relationRecord.order, color, width, relationRecord);
                    if (obj) relations.push(relationRecord);
                }
            });

            $('deleteAllRelationsBtn').disabled = relations.length === 0;
            updateAnnotationBadges();
            updateXray();
            selectBuildings([]);
            updateMultiLinkUI();
            $('deleteSelectedAnnotationBtn').disabled = true;
            $('editAnnotationBtn').disabled = true;
            $('deleteSelectedRelationsBtn').disabled = true;
            $('deleteSelectedAnnotationsBtn').disabled = true;
            $('confirmMultiLinkBtn').disabled = true;
            $('clearLinkSelectionBtn').disabled = true;
            $('deleteBuildingBtn').disabled = true;

            if (data.projectName) updateFileName(data.projectName);
            $('analysisStatus').textContent = '已還原自動儲存的專案。';
        }

        renderer.domElement.addEventListener('click', (e) => {
            // 如果正在拖曳或處於特定模式則跳過
            if (isDragging) return;
            if (annotationMode || footprintMode || relationMode || multiLinkMode || lineSelectMode || deleteMode) return;

            const r = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
            pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const targets = [];
            mainBuilding.traverse(o => { if (o.isMesh) targets.push(o); });
            additionsGroup.traverse(o => { if (o.isMesh) targets.push(o); });

            const hit = raycaster.intersectObjects(targets, false)[0];
            if (hit) {
                let g = hit.object;
                while (g.parent && g.parent !== mainBuilding && g.parent !== additionsGroup) {
                    g = g.parent;
                }
                let building = null;
                if (g.parent === mainBuilding) building = mainBuilding;
                else if (g.parent === additionsGroup) building = g;
                if (building) {
                    // 自動選取並聚焦
                    selectBuildings([building]);
                    return;
                }
            }
            // 點到空白處取消選取
            if (!e.shiftKey) selectBuildings([]);
        });

        // 保留移動模式的拖曳邏輯
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (moveMode) {
                const building = getBuildingFromRaycast(e);
                if (building) {
                    startDrag(e, building);
                    return;
                }
                if (isDragging) endDrag();
                return;
            }
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (moveMode && isDragging) {
                updateDrag(e);
                return;
            }
            if (moveMode && !isDragging) {
                const building = getBuildingFromRaycast(e);
                renderer.domElement.style.cursor = building ? 'grab' : 'default';
            }
        });

        renderer.domElement.addEventListener('mouseup', (e) => {
            if (moveMode && isDragging) {
                endDrag();
                return;
            }
        });

        renderer.domElement.addEventListener('mouseleave', () => {
            if (isDragging) endDrag();
        });

        // 手機觸控：移動模式的拖曳邏輯 (對應上面的滑鼠邏輯)
        function getTouchPoint(e) {
            const t = e.touches[0] || e.changedTouches[0];
            return t ? { clientX: t.clientX, clientY: t.clientY } : null;
        }

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (!moveMode) return;
            if (e.touches.length !== 1) return;
            const pt = getTouchPoint(e);
            if (!pt) return;
            const building = getBuildingFromRaycast(pt);
            if (building) {
                e.preventDefault();
                startDrag(pt, building);
                return;
            }
            if (isDragging) endDrag();
        }, { passive: false });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (moveMode && isDragging) {
                const pt = getTouchPoint(e);
                if (pt) {
                    e.preventDefault();
                    updateDrag(pt);
                }
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchend', (e) => {
            if (moveMode && isDragging) {
                e.preventDefault();
                endDrag();
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchcancel', () => {
            if (isDragging) endDrag();
        });

        // 框選模式仍保留
        renderer.domElement.addEventListener('click', (e) => {
            if (isDragging) return;
            if (footprintMode) {
                const p = groundPoint(e);
                if (p) drawFootprint(p);
                return;
            }
            if (annotationMode) {
                const floorSel = $('annotationFloorSelect') ? $('annotationFloorSelect').value : 'surface';
                if (floorSel !== 'surface') {
                    const targetBuilding = getAnnotationTargetBuilding();
                    if (!targetBuilding) { $('analysisStatus').textContent = '請先選取一棟建物以指定樓層'; return; }
                    const localY = getFloorLocalY(floorSel, targetBuilding);
                    const point = computeFloorClickPoint(e, targetBuilding, localY);
                    if (!point) return;
                    const text = prompt('請輸入標示文字', '');
                    if (text === null || text.trim() === '') return;
                    addAnnotation(point, text.trim(), $('annotationIcon').value, $('annotationColor').value,
                        targetBuilding, floorSel);
                    return;
                }

                const r = renderer.domElement.getBoundingClientRect();
                pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
                pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);

                const targets = [];
                mainBuilding.traverse(o => { if (o.isMesh) targets.push(o); });
                additionsGroup.traverse(o => { if (o.isMesh) targets.push(o); });

                const hit = raycaster.intersectObjects(targets, false)[0];
                let point, parentGroup;
                if (hit) {
                    let g = hit.object;
                    while (g.parent && g.parent !== mainBuilding && g.parent !== additionsGroup) {
                        g = g.parent;
                    }
                    parentGroup = (g.parent === additionsGroup) ? g : mainBuilding;
                    point = hit.point.clone();
                } else {
                    // 未點中建築物表面時，改為在地面/場地任意點標註
                    const groundHit = raycaster.intersectObject(ground)[0];
                    if (!groundHit) return;
                    point = groundHit.point.clone();
                    parentGroup = groundGroup;
                }
                const text = prompt('請輸入標示文字', '');
                if (text === null || text.trim() === '') return;
                addAnnotation(point, text.trim(), $('annotationIcon').value, $('annotationColor').value,
                    parentGroup);
                return;
            }
            if (deleteMode) {
                const building = getBuildingFromRaycast(e);
                if (building) {
                    selectBuildings([building]);
                    deleteSelectedBuildings();
                }
                return;
            }
            if (lineSelectMode) {
                const r = renderer.domElement.getBoundingClientRect();
                pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
                pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);

                const hit = raycaster.intersectObjects(relationGroup.children, true)[0];
                if (hit) {
                    let g = hit.object;
                    while (g && g.parent !== relationGroup) g = g.parent;
                    if (g && g.userData.relationId != null) {
                        toggleRelationSelection(g.userData.relationId, g);
                    }
                } else {
                    $('analysisStatus').textContent = '未點中任何連線';
                }
                return;
            }
            // 其他模式維持原有行為，但排除selectionMode（因為已經用點擊聚焦取代）
            if (selectionMode) {
                const r = renderer.domElement.getBoundingClientRect();
                pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
                pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);

                const targets = [];
                mainBuilding.traverse(o => { if (o.isMesh) targets.push(o); });
                additionsGroup.traverse(o => { if (o.isMesh) targets.push(o); });

                const hit = raycaster.intersectObjects(targets, false)[0];
                if (hit) {
                    let g = hit.object;
                    while (g.parent && g.parent !== mainBuilding && g.parent !== additionsGroup) {
                        g = g.parent;
                    }
                    let building = null;
                    if (g.parent === mainBuilding) building = mainBuilding;
                    else if (g.parent === additionsGroup) building = g;
                    if (building) {
                        if (e.shiftKey) {
                            toggleBuildingSelection(building);
                        } else {
                            selectBuildings([building]);
                        }
                    }
                } else {
                    if (!e.shiftKey) selectBuildings([]);
                }
                return;
            }
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (!footprintMode || !footprintStart) return;
            const p = groundPoint(e);
            if (!p) return;
            if (footprintPreview) scene.remove(footprintPreview);
            footprintPreview = new THREE.Mesh(
                new THREE.BoxGeometry(Math.abs(p.x - footprintStart.x), 0.08, Math.abs(p.z - footprintStart.z)),
                new THREE.MeshBasicMaterial({ color: '#3b67f2', transparent: true, opacity: 0.28 })
            );
            footprintPreview.position.set((p.x + footprintStart.x) / 2, 0.07, (p.z + footprintStart.z) / 2);
            scene.add(footprintPreview);
        });

        // === EXPORT / IMPORT ===
        $('exportBtn').onclick = () => {
            const data = getProjectData();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
            a.download = 'forma-building-project.json';
            a.click();
            URL.revokeObjectURL(a.href);
        };
        $('importInput').onchange = e => {
            const f = e.target.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);
                    if (f.name) {
                        const base = f.name.replace(/\.[^.]+$/, '');
                        updateFileName(base);
                    }
                    loadProjectData(data);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    $('analysisStatus').textContent = '已載入專案設定、標示與建物。';
                } catch (e) { alert('無效的 JSON 檔案。');
                    console.error(e); }
            };
            reader.readAsText(f);
        };

        // === RESIZE ===
        function resize() {
            const r = canvas.getBoundingClientRect();
            if (r.width === 0 || r.height === 0) return;
            camera.aspect = r.width / r.height;
            camera.updateProjectionMatrix();
            renderer.setSize(r.width, r.height);
            labelRenderer.setSize(r.width, r.height);
        }
        const resizeObserver = new ResizeObserver(resize);
        resizeObserver.observe(canvas);

        // === ANIMATION LOOP ===
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateRelationVisualScale();
            updateRelationBlink();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // === COLLAPSIBLE ===
        document.querySelectorAll('.section-header').forEach(header => {
            header.addEventListener('click', () => {
                const targetId = header.dataset.target;
                const body = document.getElementById(targetId);
                if (!body) return;
                const isOpen = body.classList.toggle('open');
                header.classList.toggle('open', isOpen);
            });
        });

        // === INIT ===
        setTimeout(resize, 50);
        generateMain();
        animate();

        const hasAutoSave = loadAutoSave();
        if (!hasAutoSave) {
            updateFileName('3D 建築視圖');
            $('analysisStatus').textContent = '就緒 — 可調整參數後生成建築';
        }

        updateMultiLinkUI();
        $('deleteSelectedAnnotationBtn').disabled = true;
        $('editAnnotationBtn').disabled = true;
        $('deleteAllRelationsBtn').disabled = true;
        $('deleteSelectedRelationsBtn').disabled = true;
        $('deleteSelectedAnnotationsBtn').disabled = true;
        $('confirmMultiLinkBtn').disabled = true;
        $('clearLinkSelectionBtn').disabled = true;
        $('deleteBuildingBtn').disabled = true;
        document.querySelector('[data-target="buildingConfig"]')?.classList.add('open');
        document.getElementById('buildingConfig')?.classList.add('open');

        window.addEventListener('beforeunload', () => { autoSave(); });

        console.log('Forma 已啟動，版本 6.0 — 自動聚焦點擊建築，無右下提示框');
    </script>
</body>
</html>
